<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antardrishti AI - Journaling Companion</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .card { max-width: 500px; margin: 20px auto; background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    h1 { font-size: 1.5rem; text-align: center; color: #38bdf8; margin-bottom: 8px; }
    p { text-align: center; color: #94a3b8; font-size: 0.9rem; }
    input, textarea, button { width: 100%; box-sizing: border-box; margin-top: 12px; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    textarea { height: 100px; resize: vertical; }
    button { background: #0284c7; border: none; font-weight: bold; cursor: pointer; }
    button:active { background: #0369a1; }
    #status { margin-top: 15px; font-size: 0.85rem; text-align: center; color: #38bdf8; }
    .entry-list { margin-top: 20px; font-size: 0.9rem; }
    .entry-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid #38bdf8; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="card">
    <h1>Antardrishti AI</h1>
    <p>Privacy-First Reflective Journaling Companion</p>
    
    <div id="authSection">
      <input type="email" id="email" placeholder="Email address" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="signUp()">Sign Up / Sign In</button>
    </div>

    <div id="journalSection" style="display: none;">
      <textarea id="journalInput" placeholder="Write your reflection here..."></textarea>
      <button onclick="saveEntry()">Save Reflection</button>
      <button onclick="signOut()" style="background: #475569;">Sign Out</button>
      <div class="entry-list" id="entries"></div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    
        const firebaseConfig = {
      apiKey: "AIzaSy...",
      authDomain: "personal-gemini-journal-ai.firebaseapp.com",
      projectId: "personal-gemini-journal-ai",
      storageBucket: "personal-gemini-journal-ai.appspot.com",
      messagingSenderId: "542365084098",
      appId: "1:542365084098:web:..."
    };
    

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
      const authDiv = document.getElementById("authSection");
      const journalDiv = document.getElementById("journalSection");
      const status = document.getElementById("status");

      if (user) {
        authDiv.style.display = "none";
        journalDiv.style.display = "block";
        status.innerText = "Signed in as: " + user.email;
        loadEntries(user.uid);
      } else {
        authDiv.style.display = "block";
        journalDiv.style.display = "none";
        status.innerText = "Please sign in to save your reflections.";
      }
    });

    async function signUp() {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (e) {
        await auth.createUserWithEmailAndPassword(email, pass);
      }
    }

    async function signOut() {
      await auth.signOut();
    }

    async function saveEntry() {
      const text = document.getElementById("journalInput").value;
      if (!text) return;
      const user = auth.currentUser;
      await db.collection("journals").add({
        uid: user.uid,
        content: text,
        createdAt: new Date().toISOString()
      });
      document.getElementById("journalInput").value = "";
      loadEntries(user.uid);
    }

    async function loadEntries(uid) {
      const snapshot = await db.collection("journals").where("uid", "==", uid).get();
      const container = document.getElementById("entries");
      container.innerHTML = "";
      snapshot.forEach(doc => {
        const data = doc.data();
        const div = document.createElement("div");
        div.className = "entry-item";
        div.innerText = data.content;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
